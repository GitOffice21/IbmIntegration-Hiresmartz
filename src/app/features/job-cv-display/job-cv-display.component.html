
<app-loader [isLoading]="loading"></app-loader>
<div class="page-container">
  <div  class="back-button" *ngIf="showBackButton()">
    <!-- <button class="back-button" (click)="GoBack()">Back</button> -->

    <a href="javascript:history.back()" class="back-link">      <mat-icon>arrow_back</mat-icon> <span>Back</span> </a>

  </div>

  <div class="cv-score-container">
    <div class="main-content">
      <div class="score-section">
        <div style="margin-bottom: 2%">CV Score (Max 100)</div>
        <div class="scorebox">
          <input matInput class="score-value" [value]="score" readonly *ngIf="!loading" />
       
        </div>

        <h3 style="font-weight: 500; font-size: 16px">Detailed explanation</h3>
        <div class="explanation" style="border: 100px #e2e2e2">
          <p>
            {{ explanation }}
          </p>
        </div>
      </div>
      <div class="resume-section">
        <div >
          <iframe *ngIf="pdfSrc" [src]="pdfSrc" width="100%" height="500px"></iframe>
        </div>
      </div>
    
    </div>
    <div style="position: sticky; bottom:-20px;display: flex; justify-content: center; width: 100%;z-index: 1; "  *ngIf="!isJobCVDisplayRoute">
      <button class="logout-btn" (click)="submitnav()">Submit</button>
    </div>
  </div>

</div>
