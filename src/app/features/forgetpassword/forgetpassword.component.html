
<app-loader [isLoading]="loading"></app-loader>
<div class="main">
    <div class="left-section">
    </div>
   
    <div class="right-section">
      <div class="toplogo">
        <span class="logo-text">Hire<span style="color: black;" >Smartz</span></span>
      </div>
      <div class="main-content">
        <div class="formcard">
          <p class="heading">Forgot Password</p>
          <span class="subheading">Enter your email to request temporary password.</span>
          <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgotpasswordform">
              <div class="detail">
                <!-- <mat-label>Email</mat-label> -->
                <mat-form-field appearance="outline">
                  <input type="email" formControlName="email" matInput placeholder="Email" />
                 
                </mat-form-field>
                <div class="errormessage">
                  <mat-error *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.errors?.['required']">
                    Please enter an email.
                  </mat-error>
                  <mat-error *ngIf="forgotPasswordForm.get('email')?.touched && forgotPasswordForm.get('email')?.errors?.['pattern']">
                    Enter a valid email address.
                  </mat-error>
                </div>
              </div>
              <button type="submit" class="forgotpasswordbutton">SUBMIT</button>
              <div  class="back" (click)="onLogin()"><mat-icon style="margin: 0px 3px -8px 0px;">keyboard_backspace</mat-icon> Go back to Login</div>
            </form>
           
          <!-- <div class="login">
            <span class="tologin">Back to</span> <span (click)="onLogin()"  class="back">Login</span>
          </div> -->
        </div>
      </div>
      <div class="footer">
        <p>Copyright ©2025 Hiresmartz Recruitment. All Rights Reserved.</p>
    </div>
    </div>
   
  </div>
